<text class="t1" x="24" y="76" font-size="19" font-weight="700">Streaming Conversational Agent</text><text class="t2" x="24" y="96" font-size="13.5">A voice interaction pipeline that connects automatic speech</text><text class="t2" x="24" y="116" font-size="13.5">recognition, an LLM, and neural speech synthesis through a</text><text class="t2" x="24" y="136" font-size="13.5">streaming backend. The focus is on coordinating the stages</text><text class="t2" x="24" y="156" font-size="13.5">and reducing response delay.</text><text class="t2" x="24" y="190" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="202" width="75.8" height="28" rx="14.0"/><text class="pt" x="61.9" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">FastAPI</text><rect class="pf" x="107.8" y="202" width="97.3" height="28" rx="14.0"/><text class="pt" x="156.5" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">LangGraph</text><rect class="pf" x="213.1" y="202" width="105.3" height="28" rx="14.0"/><text class="pt" x="265.8" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">WebSockets</text></svg>
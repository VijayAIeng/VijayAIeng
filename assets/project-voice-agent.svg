<text class="pt" x="24" y="46" font-size="11.5" font-weight="800" letter-spacing="2">PROJECT 04</text>
<text class="t1" x="24" y="72" font-size="19" font-weight="700">Streaming Conversational Agent</text>
<text class="t2" x="24" y="92" font-size="13.5">A voice interaction pipeline that connects automatic</text><text class="t2" x="24" y="112" font-size="13.5">speech recognition, an LLM, and neural speech synthesis</text><text class="t2" x="24" y="132" font-size="13.5">through a streaming backend. The focus is on</text><text class="t2" x="24" y="152" font-size="13.5">coordinating the stages and reducing response delay.</text><text class="t2" x="24" y="188" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="200" width="78.5" height="28" rx="14.0"/><text class="pt" x="63.2" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">FastAPI</text><rect class="pf" x="110.5" y="200" width="93.5" height="28" rx="14.0"/><text class="pt" x="157.2" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">LangGraph</text><rect class="pf" x="212.0" y="200" width="101.0" height="28" rx="14.0"/><text class="pt" x="262.5" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">WebSockets</text></svg>
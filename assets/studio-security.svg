<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Security design of the Studio MCP server and API routes</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><g transform="translate(0.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#2563EB"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Token gate</text><text class="t2" x="24" y="72" font-size="12.5">Bearer token with a timing-safe compare.</text><text class="t2" x="24" y="91" font-size="12.5">In production the routes stay locked</text><text class="t2" x="24" y="110" font-size="12.5">without one.</text></g><g transform="translate(306.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#EA580C"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Per-project sandbox</text><text class="t2" x="24" y="72" font-size="12.5">Every project gets its own folder, so</text><text class="t2" x="24" y="91" font-size="12.5">projects never see each other.</text></g><g transform="translate(612.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#DB2777"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Deny list</text><text class="t2" x="24" y="72" font-size="12.5">node_modules, .git, .next and .env files</text><text class="t2" x="24" y="91" font-size="12.5">are blocked, and symlink breakouts are</text><text class="t2" x="24" y="110" font-size="12.5">caught.</text></g><g transform="translate(0.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#D97706"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Write limits</text><text class="t2" x="24" y="72" font-size="12.5">Writes are limited to an extension</text><text class="t2" x="24" y="91" font-size="12.5">allow-list with a 1 MB cap per file.</text></g><g transform="translate(306.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#16A34A"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Read-only switch</text><text class="t2" x="24" y="72" font-size="12.5">One environment flag turns every write</text><text class="t2" x="24" y="91" font-size="12.5">tool off.</text></g><g transform="translate(612.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#0891B2"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Safe proxy</text><text class="t2" x="24" y="72" font-size="12.5">The browser never calls FastAPI directly,</text><text class="t2" x="24" y="91" font-size="12.5">so there is no CORS and the backend</text><text class="t2" x="24" y="110" font-size="12.5">URL stays private.</text></g></svg>
<text class="pt" x="24" y="46" font-size="11.5" font-weight="800" letter-spacing="2">PROJECT 02</text>
<text class="t1" x="24" y="72" font-size="19" font-weight="700">EMOD: Expressive Speech</text>
<text class="t2" x="24" y="92" font-size="13.5">Research into zero-shot emotion transfer for text-to-</text><text class="t2" x="24" y="112" font-size="13.5">speech. The approach investigates disentangled</text><text class="t2" x="24" y="132" font-size="13.5">representations for controlling expressive delivery</text><text class="t2" x="24" y="152" font-size="13.5">without separately fine-tuning for every emotion.</text><text class="t2" x="24" y="188" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="200" width="78.5" height="28" rx="14.0"/><text class="pt" x="63.2" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">PyTorch</text><rect class="pf" x="110.5" y="200" width="93.5" height="28" rx="14.0"/><text class="pt" x="157.2" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">StyleTTS2</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Six-step AI-assisted engineering workflow: frame, generate, read, run, harden, document</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><g transform="translate(0.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#0D9488"/><defs><linearGradient id="nworkflow-steps0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#0F766E"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps0)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Frame</text><text class="t2" x="24" y="72" font-size="12.5">Write the goal, the constraints and</text><text class="t2" x="24" y="91" font-size="12.5">the output contract in plain words</text><text class="t2" x="24" y="110" font-size="12.5">before any code exists.</text></g><g transform="translate(306.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#2563EB"/><defs><linearGradient id="nworkflow-steps1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps1)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Generate</text><text class="t2" x="24" y="72" font-size="12.5">Let the assistant draft a thin</text><text class="t2" x="24" y="91" font-size="12.5">end-to-end slice quickly, then widen</text><text class="t2" x="24" y="110" font-size="12.5">it.</text></g><g transform="translate(612.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#4F46E5"/><defs><linearGradient id="nworkflow-steps2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#4338CA"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps2)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Read</text><text class="t2" x="24" y="72" font-size="12.5">Read every diff. If I cannot explain a</text><text class="t2" x="24" y="91" font-size="12.5">change, it does not ship.</text></g><g transform="translate(0.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#7C3AED"/><defs><linearGradient id="nworkflow-steps3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps3)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Run</text><text class="t2" x="24" y="72" font-size="12.5">Type checks, builds, real requests</text><text class="t2" x="24" y="91" font-size="12.5">and ugly edge cases, not only the</text><text class="t2" x="24" y="110" font-size="12.5">happy path.</text></g><g transform="translate(306.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#DB2777"/><defs><linearGradient id="nworkflow-steps4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DB2777"/><stop offset="100%" stop-color="#BE185D"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps4)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Harden</text><text class="t2" x="24" y="72" font-size="12.5">Auth, limits, timeouts, abort</text><text class="t2" x="24" y="91" font-size="12.5">handling and failure paths come</text><text class="t2" x="24" y="110" font-size="12.5">before polish.</text></g><g transform="translate(612.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#EA580C"/><defs><linearGradient id="nworkflow-steps5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EA580C"/><stop offset="100%" stop-color="#C2410C"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nworkflow-steps5)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">06</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Document</text><text class="t2" x="24" y="72" font-size="12.5">Env examples, protocol notes and a</text><text class="t2" x="24" y="91" font-size="12.5">README so the next person runs it</text><text class="t2" x="24" y="110" font-size="12.5">in minutes.</text></g></svg>
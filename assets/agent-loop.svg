<svg xmlns="http://www.w3.org/2000/svg" width="900" height="215" viewBox="0 0 900 215" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Agent loop: build context, stream the model, run tools through MCP, observe results, apply changes</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#94A3B8"/></marker></defs><rect class="card" x="0.6" y="20.6" width="158.8" height="102.8" rx="14"/><rect x="0.6" y="20.6" width="158.8" height="6" rx="3" fill="#7C3AED"/><circle cx="24" cy="50" r="11" fill="#7C3AED"/><text x="24" y="54.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text class="t1" x="42" y="55" font-size="14" font-weight="700">Build context</text><text class="t2" x="14" y="82" font-size="11.5">Pages, outline, selection</text><text class="t2" x="14" y="98" font-size="11.5">and attached files</text><line class="ln" x1="163" y1="72.0" x2="182" y2="72.0" marker-end="url(#ah)"/><rect class="card" x="185.6" y="20.6" width="158.8" height="102.8" rx="14"/><rect x="185.6" y="20.6" width="158.8" height="6" rx="3" fill="#4F46E5"/><circle cx="209" cy="50" r="11" fill="#4F46E5"/><text x="209" y="54.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text class="t1" x="227" y="55" font-size="12.0" font-weight="700">Stream the model</text><text class="t2" x="199" y="82" font-size="11.5">Thinking, text and tool</text><text class="t2" x="199" y="98" font-size="11.5">calls arrive live</text><line class="ln" x1="348" y1="72.0" x2="367" y2="72.0" marker-end="url(#ah)"/><rect class="card" x="370.6" y="20.6" width="158.8" height="102.8" rx="14"/><rect x="370.6" y="20.6" width="158.8" height="6" rx="3" fill="#DB2777"/><circle cx="394" cy="50" r="11" fill="#DB2777"/><text x="394" y="54.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text class="t1" x="412" y="55" font-size="14" font-weight="700">Run tools</text><text class="t2" x="384" y="82" font-size="11.5">MCP calls: read, patch,</text><text class="t2" x="384" y="98" font-size="11.5">write, search</text><line class="ln" x1="533" y1="72.0" x2="552" y2="72.0" marker-end="url(#ah)"/><rect class="card" x="555.6" y="20.6" width="158.8" height="102.8" rx="14"/><rect x="555.6" y="20.6" width="158.8" height="6" rx="3" fill="#EA580C"/><circle cx="579" cy="50" r="11" fill="#EA580C"/><text x="579" y="54.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text class="t1" x="597" y="55" font-size="14" font-weight="700">Observe</text><text class="t2" x="569" y="82" font-size="11.5">Tool results join the</text><text class="t2" x="569" y="98" font-size="11.5">conversation</text><line class="ln" x1="718" y1="72.0" x2="737" y2="72.0" marker-end="url(#ah)"/><rect class="card" x="740.6" y="20.6" width="158.8" height="102.8" rx="14"/><rect x="740.6" y="20.6" width="158.8" height="6" rx="3" fill="#0D9488"/><circle cx="764" cy="50" r="11" fill="#0D9488"/><text x="764" y="54.5" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text class="t1" x="782" y="55" font-size="14" font-weight="700">Apply</text><text class="t2" x="754" y="82" font-size="11.5">Files, pages and ops</text><text class="t2" x="754" y="98" font-size="11.5">land on the canvas</text><path class="ln" d="M635.0 127C635.0 182 265.0 182 265.0 129" marker-end="url(#ah)" stroke-dasharray="6 5"/><text class="t2" x="450.0" y="174" font-size="12" font-weight="700" text-anchor="middle">repeat while the model asks for tools, up to 6 steps</text></svg>
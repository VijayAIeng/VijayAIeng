<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Production engineering checklist: latency, cost, evaluation, observability, security, reliability</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><g transform="translate(0.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#0891B2"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Latency</text><text class="t2" x="24" y="72" font-size="12.5">Stream the first token early, batch on the</text><text class="t2" x="24" y="91" font-size="12.5">GPU, quantize, and cache the KV state.</text></g><g transform="translate(306.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#16A34A"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Cost</text><text class="t2" x="24" y="72" font-size="12.5">Right-size models, batch requests, and</text><text class="t2" x="24" y="91" font-size="12.5">track cost per request next to quality.</text></g><g transform="translate(612.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#7C3AED"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Evaluation</text><text class="t2" x="24" y="72" font-size="12.5">Build evaluation sets before launch and</text><text class="t2" x="24" y="91" font-size="12.5">rerun them on every prompt or model</text><text class="t2" x="24" y="110" font-size="12.5">change.</text></g><g transform="translate(0.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#2563EB"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Observability</text><text class="t2" x="24" y="72" font-size="12.5">Traces, logs and drift checks so a bad</text><text class="t2" x="24" y="91" font-size="12.5">answer can be explained, not guessed.</text></g><g transform="translate(306.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#DB2777"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Security</text><text class="t2" x="24" y="72" font-size="12.5">Prompt injection defenses, sandboxed</text><text class="t2" x="24" y="91" font-size="12.5">tools and least-privilege access for every</text><text class="t2" x="24" y="110" font-size="12.5">agent.</text></g><g transform="translate(612.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#EA580C"/><text class="t1" x="24" y="40" font-size="16" font-weight="700">Reliability</text><text class="t2" x="24" y="72" font-size="12.5">Timeouts, heartbeats, abort handling and</text><text class="t2" x="24" y="91" font-size="12.5">safe retries so long streams survive real</text><text class="t2" x="24" y="110" font-size="12.5">networks.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="254" viewBox="0 0 440 254" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Studio MCP Server</title><style>

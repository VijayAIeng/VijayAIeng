<text class="t1" x="24" y="76" font-size="19" font-weight="700">Studio MCP Server</text><text class="t2" x="24" y="96" font-size="13.5">A JSON-RPC 2.0 MCP server inside a Next.js route with</text><text class="t2" x="24" y="116" font-size="13.5">eight sandboxed file tools, so an agent can list, read, search,</text><text class="t2" x="24" y="136" font-size="13.5">patch, write and move project files safely.</text><text class="t2" x="24" y="170" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="182" width="55.7" height="28" rx="14.0"/><text class="pt" x="51.9" y="200.5" font-size="12.5" font-weight="600" text-anchor="middle">MCP</text><rect class="pf" x="87.7" y="182" width="95.1" height="28" rx="14.0"/><text class="pt" x="135.3" y="200.5" font-size="12.5" font-weight="600" text-anchor="middle">JSON-RPC</text><rect class="pf" x="190.8" y="182" width="74.3" height="28" rx="14.0"/><text class="pt" x="228.0" y="200.5" font-size="12.5" font-weight="600" text-anchor="middle">Node.js</text><rect class="pf" x="273.2" y="182" width="78.8" height="28" rx="14.0"/><text class="pt" x="312.5" y="200.5" font-size="12.5" font-weight="600" text-anchor="middle">Security</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Six-step research reading routine</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><g transform="translate(0.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#D97706"/><defs><linearGradient id="nresearch-steps0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#B45309"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps0)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Skim</text><text class="t2" x="24" y="72" font-size="12.5">Abstract, figures and conclusion</text><text class="t2" x="24" y="91" font-size="12.5">first. Decide in minutes whether the</text><text class="t2" x="24" y="110" font-size="12.5">paper deserves a deep read.</text></g><g transform="translate(306.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#EA580C"/><defs><linearGradient id="nresearch-steps1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EA580C"/><stop offset="100%" stop-color="#C2410C"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps1)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Find the method</text><text class="t2" x="24" y="72" font-size="12.5">Locate the one idea that actually</text><text class="t2" x="24" y="91" font-size="12.5">changed. Everything else is setup.</text></g><g transform="translate(612.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#DB2777"/><defs><linearGradient id="nresearch-steps2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DB2777"/><stop offset="100%" stop-color="#BE185D"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps2)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Check the evidence</text><text class="t2" x="24" y="72" font-size="12.5">Look at benchmarks, ablations and</text><text class="t2" x="24" y="91" font-size="12.5">what the authors did not test.</text></g><g transform="translate(0.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#7C3AED"/><defs><linearGradient id="nresearch-steps3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps3)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Reproduce small</text><text class="t2" x="24" y="72" font-size="12.5">Rebuild the core idea as a tiny</text><text class="t2" x="24" y="91" font-size="12.5">PyTorch experiment before trusting</text><text class="t2" x="24" y="110" font-size="12.5">it.</text></g><g transform="translate(306.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#2563EB"/><defs><linearGradient id="nresearch-steps4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps4)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Price it</text><text class="t2" x="24" y="72" font-size="12.5">Ask what it costs in latency,</text><text class="t2" x="24" y="91" font-size="12.5">memory and money at real traffic.</text></g><g transform="translate(612.0,153)"><rect class="card" x="0.6" y="0.6" width="286.8" height="133.8" rx="14"/><rect x="0.6" y="16" width="5" height="103" rx="2.5" fill="#0D9488"/><defs><linearGradient id="nresearch-steps5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#0F766E"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nresearch-steps5)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">06</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Write it down</text><text class="t2" x="24" y="72" font-size="12.5">Turn the notes into a repository so</text><text class="t2" x="24" y="91" font-size="12.5">the knowledge survives the week.</text></g></svg>
<text class="pt" x="24" y="50" font-size="11.5" font-weight="800" letter-spacing="2">PROJECT 01</text>
<text class="t1" x="24" y="76" font-size="19" font-weight="700">Brahm Studio</text><text class="t2" x="24" y="96" font-size="13.5">An AI website builder with a Figma-style canvas. Chat</text><text class="t2" x="24" y="116" font-size="13.5">describes a page, an agent writes the code, and the canvas</text><text class="t2" x="24" y="136" font-size="13.5">turns it into editable layers that are saved back to real Next.js</text><text class="t2" x="24" y="156" font-size="13.5">files.</text><text class="t2" x="24" y="190" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="202" width="69.9" height="28" rx="14.0"/><text class="pt" x="58.9" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">Next.js</text><rect class="pf" x="101.9" y="202" width="62.4" height="28" rx="14.0"/><text class="pt" x="133.1" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">React</text><rect class="pf" x="172.3" y="202" width="94.1" height="28" rx="14.0"/><text class="pt" x="219.4" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">TypeScript</text><rect class="pf" x="274.4" y="202" width="55.7" height="28" rx="14.0"/><text class="pt" x="302.3" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">MCP</text><rect class="pf" x="338.2" y="202" width="75.8" height="28" rx="14.0"/><text class="pt" x="376.1" y="220.5" font-size="12.5" font-weight="600" text-anchor="middle">FastAPI</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="192" viewBox="0 0 900 192" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Three ways the AI changes the canvas: code, design JSON and targeted operations</title><style>
.card{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.2}
.t1{fill:#0F172A}.t2{fill:#475569}
.ln{stroke:#94A3B8;fill:none;stroke-width:2}
.pf{fill:#4F46E5;fill-opacity:.12;stroke:#4F46E5;stroke-opacity:.5;stroke-width:1}
.pt{fill:#4338CA}
@media (prefers-color-scheme: dark){
.card{fill:#161B22;stroke:#30363D}
.t1{fill:#E6EDF3}.t2{fill:#9DA7B3}
.pt{fill:#A5B4FC}.pf{fill-opacity:.16}
}
</style><g transform="translate(0.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="190.8" rx="14"/><rect x="0.6" y="16" width="5" height="160" rx="2.5" fill="#7C3AED"/><defs><linearGradient id="nstudio-modes0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nstudio-modes0)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Code</text><text class="t2" x="24" y="72" font-size="12.5">Fenced blocks with a path, file tags,</text><text class="t2" x="24" y="91" font-size="12.5">or a files event. Page files are</text><text class="t2" x="24" y="110" font-size="12.5">rendered off-screen, measured in</text><text class="t2" x="24" y="129" font-size="12.5">the real browser, and converted into</text><text class="t2" x="24" y="148" font-size="12.5">editable layers, then written to the</text><text class="t2" x="24" y="167" font-size="12.5">workspace through MCP.</text></g><g transform="translate(306.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="190.8" rx="14"/><rect x="0.6" y="16" width="5" height="160" rx="2.5" fill="#0D9488"/><defs><linearGradient id="nstudio-modes1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#0F766E"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nstudio-modes1)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Design JSON</text><text class="t2" x="24" y="72" font-size="12.5">A pages event with frame, text,</text><text class="t2" x="24" y="91" font-size="12.5">button, input, image, rect, ellipse,</text><text class="t2" x="24" y="110" font-size="12.5">line and group nodes. Auto layout</text><text class="t2" x="24" y="129" font-size="12.5">frames stack their children, so the</text><text class="t2" x="24" y="148" font-size="12.5">model never has to guess every</text><text class="t2" x="24" y="167" font-size="12.5">coordinate.</text></g><g transform="translate(612.0,0)"><rect class="card" x="0.6" y="0.6" width="286.8" height="190.8" rx="14"/><rect x="0.6" y="16" width="5" height="160" rx="2.5" fill="#DB2777"/><defs><linearGradient id="nstudio-modes2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DB2777"/><stop offset="100%" stop-color="#BE185D"/></linearGradient></defs><circle cx="34" cy="34" r="16" fill="url(#nstudio-modes2)"/><text x="34" y="39" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text class="t1" x="56" y="40" font-size="16" font-weight="700">Targeted ops</text><text class="t2" x="24" y="72" font-size="12.5">Update, add, delete, create page,</text><text class="t2" x="24" y="91" font-size="12.5">rename page, delete page and</text><text class="t2" x="24" y="110" font-size="12.5">select. Each batch is grouped into</text><text class="t2" x="24" y="129" font-size="12.5">one undo step, so a bad AI edit is a</text><text class="t2" x="24" y="148" font-size="12.5">single shortcut away from gone.</text></g></svg>
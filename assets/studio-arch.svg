<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" role="img"><title>Brahm Studio architecture: browser canvas, chat proxy route to the Brahm FastAPI backend, MCP route to a sandboxed workspace</title><style>

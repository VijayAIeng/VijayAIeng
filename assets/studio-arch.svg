580C"/><text class="t2" x="682" y="270" font-size="12">One folder per project</text><circle cx="670" cy="287" r="3" fill="#EA580C"/><text class="t2" x="682" y="291" font-size="12">Generated Next.js files</text><circle cx="670" cy="308" r="3" fill="#EA580C"/><text class="t2" x="682" y="312" font-size="12">Deny list and size limits</text><line class="ln" x1="252" y1="100" x2="333" y2="100" marker-end="url(#ah)" marker-start="url(#ahs)"/><text class="t2" x="292.5" y="91" font-size="10.5" font-weight="700" text-anchor="middle">chat</text><line class="ln" x1="567" y1="100" x2="648" y2="100" marker-end="url(#ah)" marker-start="url(#ahs)"/><text class="t2" x="607.5" y="91" font-size="10.5" font-weight="700" text-anchor="middle">SSE</text><line class="ln" x1="252" y1="270" x2="333" y2="270" marker-end="url(#ah)" marker-start="url(#ahs)"/><text class="t2" x="292.5" y="261" font-size="10.5" font-weight="700" text-anchor="middle">tools</text><line class="ln" x1="567" y1="270" x2="648" y2="270" marker-end="url(#ah)" marker-start="url(#ahs)"/><text class="t2" x="607.5" y="261" font-size="10.5" font-weight="700" text-anchor="middle">fs</text></svg>
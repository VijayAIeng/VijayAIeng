<text class="t1" x="24" y="72" font-size="19" font-weight="700">Enterprise RAG Platform</text>
<text class="t2" x="24" y="92" font-size="13.5">A retrieval-augmented generation design combining dense</text><text class="t2" x="24" y="112" font-size="13.5">retrieval with graph-based context. The architecture</text><text class="t2" x="24" y="132" font-size="13.5">includes role-based access control and audit logging for</text><text class="t2" x="24" y="152" font-size="13.5">enterprise document workflows.</text><text class="t2" x="24" y="188" font-size="11" font-weight="700" letter-spacing="1.5">TECHNOLOGY</text><rect class="pf" x="24.0" y="200" width="93.5" height="28" rx="14.0"/><text class="pt" x="70.8" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">LangChain</text><rect class="pf" x="125.5" y="200" width="86.0" height="28" rx="14.0"/><text class="pt" x="168.5" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">Weaviate</text><rect class="pf" x="219.5" y="200" width="63.5" height="28" rx="14.0"/><text class="pt" x="251.2" y="218.5" font-size="12.5" font-weight="600" text-anchor="middle">Neo4j</text></svg>